name: ci
on:
  push:
  pull_request:
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/ReservaSalas.Api/ReservaSalas.Api.csproj --configuration Release
      - run: dotnet test tests/ReservaSalas.UnitTests/ReservaSalas.UnitTests.csproj --configuration Release
      - run: dotnet run --project tests/ReservaSalas.Tests/ReservaSalas.Tests.csproj --configuration Release
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
