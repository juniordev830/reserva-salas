name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build src/ReservaSalas/ReservaSalas.csproj --configuration Release
      - run: dotnet run --project tests/ReservaSalas.Tests/ReservaSalas.Tests.csproj --configuration Release
